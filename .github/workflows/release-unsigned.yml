name: Unsigned Iceon stable release

on:
  push:
    tags: ['0.0.2']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable stable tag (0.0.2); dispatch at the same commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-stable-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate immutable stable tag, same-commit CI and release configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          if not re.fullmatch(rf'{number}\.{number}\.{number}', tag) or tag != '0.0.2':
              raise SystemExit('This route accepts only the canonical stable tag 0.0.2, without v')
          package = json.loads(Path('package.json').read_text())
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          local = [p for p in lock['package'] if p['name'] == cargo['package']['name'] and 'source' not in p]
          if len(local) != 1:
              raise SystemExit('Expected one local application package in Cargo.lock')
          if any(v != tag for v in [package['version'], config['version'], cargo['package']['version'], local[0]['version']]):
              raise SystemExit('Tag must match every application manifest and local Cargo.lock version')
          if config.get('productName') != 'Iceon' or config['identifier'] != 'ad.yan.iceon':
              raise SystemExit('Expected the Iceon product and bundle identifier')
          if cargo['package']['name'] != 'iceon':
              raise SystemExit('The Rust package and executable must be named iceon')
          overlay = json.loads(Path('.github/release-unsigned.json').read_text())
          if overlay['bundle']['createUpdaterArtifacts'] is not False or overlay['bundle']['macOS']['signingIdentity'] != '-':
              raise SystemExit('Expected the tracked ad-hoc signing overlay without updater artifacts')
          if overlay['plugins']['updater'] != {'pubkey': '', 'endpoints': []}:
              raise SystemExit('Unsigned releases require disabled updater configuration')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if git('rev-parse', f'refs/tags/{tag}^{{commit}}') != head or head != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Tag, checkout and reusable CI commit must agree; dispatch from the tag or same commit')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          changelog = Path('CHANGELOG.md').read_text()
          sections = list(re.finditer(r'^## (.+)$', changelog, re.MULTILINE))
          headings = []
          for section in sections:
              heading = re.fullmatch(rf'({number}\.{number}\.{number})(?: \(pending CI\))?', section[1])
              if heading is None:
                  raise SystemExit('Expected canonical stable changelog headings, optionally marked (pending CI)')
              headings.append(heading[1])
          if headings.count(tag) != 1:
              raise SystemExit('Expected exactly one changelog section for the release tag')
          index = headings.index(tag)
          end = sections[index + 1].start() if index + 1 < len(sections) else len(changelog)
          notes = changelog[sections[index].end():end].strip()
          if not notes:
              raise SystemExit('Release notes must not be empty')
          Path('/tmp/iceon-release-notes.md').write_text(notes + '\n')
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build ad-hoc application without signing secrets or notarization
        env:
          SKIP_NOTARIZATION: 'true'
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_PATH TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          bun run tauri build --target aarch64-apple-darwin --bundles app \
            --config .github/release-unsigned.json -- --locked
          git diff --exit-code
          git diff --cached --exit-code
      - name: Create headless DMG without Finder or AppleScript
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto "$bundle/macos/Iceon.app" "$staging/Iceon.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$bundle/dmg"
          hdiutil create -volname Iceon -srcfolder "$staging" -ov -format UDZO \
            "$bundle/dmg/Iceon_${RELEASE_TAG}_aarch64.dmg"
      - name: Verify bundle metadata, signature, architecture and updater absence
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/Iceon.app"
          codesign -dv --verbose=4 "$bundle/macos/Iceon.app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$bundle/macos/Iceon.app/Contents/MacOS/iceon")" = arm64
          python3 - <<'PY'
          import json, os, plistlib, shutil
          from pathlib import Path
          bundle = Path('src-tauri/target/aarch64-apple-darwin/release/bundle')
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          with (bundle / 'macos/Iceon.app/Contents/Info.plist').open('rb') as f:
              plist = plistlib.load(f)
          version = config['version']
          # Tauri uses the complete SemVer for both keys unless bundleVersion overrides it.
          expected_build = config.get('bundle', {}).get('macOS', {}).get('bundleVersion', version)
          expected = {'CFBundleShortVersionString': version, 'CFBundleVersion': expected_build,
                      'CFBundleIdentifier': config['identifier'], 'CFBundleExecutable': 'iceon',
                      'CFBundleName': config['productName']}
          for key, value in expected.items():
              if plist.get(key) != value:
                  raise SystemExit(f'{key} differs from configured value: {plist.get(key)!r} != {value!r}')
          if 'CFBundleDisplayName' in plist and plist['CFBundleDisplayName'] != config['productName']:
              raise SystemExit('CFBundleDisplayName must be absent or match productName')
          if any(list(bundle.rglob(pattern)) for pattern in ['latest.json', '*.sig', '*.app.tar.gz']):
              raise SystemExit('Unsigned release must not produce updater artifacts')
          dmgs = list((bundle / 'dmg').glob('*.dmg'))
          if len(dmgs) != 1:
              raise SystemExit('Expected exactly one Apple Silicon DMG')
          assets = Path('release-assets')
          assets.mkdir()
          shutil.copy2(dmgs[0], assets / dmgs[0].name)
          PY
          dmg=(release-assets/*.dmg)
          hdiutil verify "${dmg[0]}"
          mount_dir=$(mktemp -d)
          mount_dir=$(cd "$mount_dir" && pwd -P)
          cleanup() {
            status=$?
            trap - EXIT
            if mount | grep -Fq " on $mount_dir ("; then
              # Spotlight can briefly hold a newly mounted image; never force-detach it.
              for attempt in 1 2 3; do
                if hdiutil detach "$mount_dir"; then
                  break
                fi
                sleep 2
              done
            fi
            if mount | grep -Fq " on $mount_dir ("; then
              echo 'Failed to detach release DMG after three attempts' >&2
              status=1
            else
              rmdir "$mount_dir" || status=$?
            fi
            exit "$status"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg[0]}"
          app="$mount_dir/Iceon.app"
          test -d "$app"
          test ! -L "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$app/Contents/MacOS/iceon")" = arm64
          # Compare metadata, executable and signed resource manifest to the audited source bundle.
          for relative in Contents/Info.plist Contents/MacOS/iceon Contents/_CodeSignature/CodeResources; do
            cmp "$bundle/macos/Iceon.app/$relative" "$app/$relative"
          done
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          (cd release-assets && shasum -a 256 ./*.dmg > SHASUMS256.txt && shasum -a 256 -c SHASUMS256.txt)
      - name: Upload exact-tag draft, verify uploaded bytes, then publish stable latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --prerelease=false --latest=false --title "Iceon $RELEASE_TAG (unsigned)" \
            --notes-file /tmp/iceon-release-notes.md
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          def gh(*args):
              return subprocess.check_output(['gh', *args], timeout=120)
          release = json.loads(gh('release', 'view', tag, '--json', 'tagName,isDraft,isPrerelease,assets'))
          expected = [f'Iceon_{tag}_aarch64.dmg', 'SHASUMS256.txt']
          if release['tagName'] != tag or not release['isDraft'] or release['isPrerelease']:
              raise SystemExit('Expected an exact-tag stable draft')
          if sorted(a['name'] for a in release['assets']) != sorted(expected):
              raise SystemExit('Only the DMG and checksums may be published')
          gh('release', 'download', tag, '--dir', 'release-verify')
          for name in expected:
              local = Path('release-assets', name).read_bytes()
              uploaded = Path('release-verify', name).read_bytes()
              if hashlib.sha256(local).digest() != hashlib.sha256(uploaded).digest():
                  raise SystemExit('Uploaded asset bytes differ from verified local assets')
          subprocess.run(['shasum', '-a', '256', '-c', 'SHASUMS256.txt'], cwd='release-verify', check=True)
          gh('release', 'edit', tag, '--draft=false', '--prerelease=false', '--latest')
          published = json.loads(gh('release', 'view', tag, '--json', 'tagName,isDraft,isPrerelease'))
          if published != {'tagName': tag, 'isDraft': False, 'isPrerelease': False}:
              raise SystemExit('Published release state differs from stable publication request')
          PY
