name: Iceon release (GitHub verified updates)

on:
  push:
    tags: ['0.0.4']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable stable tag (0.0.4); dispatch at the same commit'
        required: true
        default: '0.0.4'
        type: string

permissions:
  contents: read

concurrency:
  group: signed-stable-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate immutable stable tag, same-commit CI and release configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          if not re.fullmatch(rf'{number}\.{number}\.{number}', tag) or tag != '0.0.4':
              raise SystemExit('This route accepts only the canonical stable tag 0.0.4, without v')
          package = json.loads(Path('package.json').read_text())
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          local = [p for p in lock['package'] if p['name'] == cargo['package']['name'] and 'source' not in p]
          if len(local) != 1:
              raise SystemExit('Expected one local application package in Cargo.lock')
          if any(v != tag for v in [package['version'], config['version'], cargo['package']['version'], local[0]['version']]):
              raise SystemExit('Tag must match every application manifest and local Cargo.lock version')
          if config.get('productName') != 'Iceon' or config['identifier'] != 'ad.yan.iceon':
              raise SystemExit('Expected the Iceon product and bundle identifier')
          if cargo['package']['name'] != 'iceon':
              raise SystemExit('The Rust package and executable must be named iceon')
          overlay = json.loads(Path('.github/release-autoupdate.json').read_text())
          if overlay != {'bundle': {'createUpdaterArtifacts': True, 'macOS': {'signingIdentity': '-'}}}:
              raise SystemExit('Expected ad-hoc macOS signing and signed updater artifacts')
          updater = config.get('plugins', {}).get('updater', {})
          if not updater.get('pubkey', '').strip() or updater.get('requireSignedVersion') is not True:
              raise SystemExit('Expected a public updater key and signed-version enforcement')
          if updater.get('endpoints') != ['https://github.com/yan-ad/iceon/releases/latest/download/latest.json']:
              raise SystemExit('Expected the canonical GitHub updater endpoint')
          if updater.get('windows') != {'installMode': 'quiet'}:
              raise SystemExit('Expected quiet Windows updates')
          windows = json.loads(Path('.github/release-windows.json').read_text())
          expected_windows = {'targets': ['nsis'], 'createUpdaterArtifacts': True,
              'windows': {'webviewInstallMode': {'type': 'downloadBootstrapper'},
                          'nsis': {'installMode': 'currentUser', 'languages': ['English']}}}
          if windows != {'bundle': expected_windows}:
              raise SystemExit('Unexpected Windows signed-updater overlay')
          if os.environ['GITHUB_REPOSITORY'] != 'yan-ad/iceon':
              raise SystemExit('Release must run in the canonical public repository')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if git('rev-parse', f'refs/tags/{tag}^{{commit}}') != head or head != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Tag, checkout and reusable CI commit must agree; dispatch from the tag or same commit')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          changelog = Path('CHANGELOG.md').read_text()
          sections = list(re.finditer(r'^## (.+)$', changelog, re.MULTILINE))
          headings = []
          for section in sections:
              heading = re.fullmatch(rf'({number}\.{number}\.{number})(?: \(pending CI\))?', section[1])
              if heading is None:
                  raise SystemExit('Expected canonical stable changelog headings, optionally marked (pending CI)')
              headings.append(heading[1])
          if headings.count(tag) != 1:
              raise SystemExit('Expected exactly one changelog section for the release tag')
          index = headings.index(tag)
          end = sections[index + 1].start() if index + 1 < len(sections) else len(changelog)
          notes = changelog[sections[index].end():end].strip()
          if not notes:
              raise SystemExit('Release notes must not be empty')
          Path('/tmp/iceon-release-notes.md').write_text(notes + '\n')
          PY

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: [guard, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x86
            os: windows-2022
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x86
      - uses: ./.github/actions/msvc-x86-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Compile Windows x86 backend and test targets
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target i686-pc-windows-msvc
      - name: Prove signing key matches configured public key before packaging
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key' >&2; exit 1; }
          printf 'Iceon release key proof %s\n' "$RELEASE_TAG" > "$RUNNER_TEMP/updater-key-proof"
          bun run tauri signer sign --app-version "$RELEASE_TAG" "$RUNNER_TEMP/updater-key-proof"
          cargo run --manifest-path xtask/Cargo.toml --locked --target "${{ matrix.target }}" -- verify-update src-tauri/tauri.conf.json "$RUNNER_TEMP/updater-key-proof.sig" "$RUNNER_TEMP/updater-key-proof" "$RELEASE_TAG"
      - name: Build ad-hoc application with signed updater archive
        if: runner.os == 'macOS'
        env:
          SKIP_NOTARIZATION: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_PATH
          bun run tauri build --target aarch64-apple-darwin --bundles app \
            --config .github/release-autoupdate.json -- --locked
          git diff --exit-code
          git diff --cached --exit-code
      - name: Create headless DMG without Finder or AppleScript
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto "$bundle/macos/Iceon.app" "$staging/Iceon.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$bundle/dmg"
          hdiutil create -volname Iceon -srcfolder "$staging" -ov -format UDZO \
            "$bundle/dmg/Iceon_${RELEASE_TAG}_aarch64.dmg"
      - name: Verify bundle metadata, ad-hoc signature and architecture
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/Iceon.app"
          codesign -dv --verbose=4 "$bundle/macos/Iceon.app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$bundle/macos/Iceon.app/Contents/MacOS/iceon")" = arm64
          python3 - <<'PY'
          import json, os, plistlib, shutil
          from pathlib import Path
          bundle = Path('src-tauri/target/aarch64-apple-darwin/release/bundle')
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          with (bundle / 'macos/Iceon.app/Contents/Info.plist').open('rb') as f:
              plist = plistlib.load(f)
          version = config['version']
          # Tauri uses the complete SemVer for both keys unless bundleVersion overrides it.
          expected_build = config.get('bundle', {}).get('macOS', {}).get('bundleVersion', version)
          expected = {'CFBundleShortVersionString': version, 'CFBundleVersion': expected_build,
                      'CFBundleIdentifier': config['identifier'], 'CFBundleExecutable': 'iceon',
                      'CFBundleName': config['productName']}
          for key, value in expected.items():
              if plist.get(key) != value:
                  raise SystemExit(f'{key} differs from configured value: {plist.get(key)!r} != {value!r}')
          if 'CFBundleDisplayName' in plist and plist['CFBundleDisplayName'] != config['productName']:
              raise SystemExit('CFBundleDisplayName must be absent or match productName')
          archives = list((bundle / 'macos').glob('*.app.tar.gz'))
          if len(archives) != 1 or not Path(str(archives[0]) + '.sig').is_file():
              raise SystemExit('Expected exactly one signed updater archive')
          dmgs = list((bundle / 'dmg').glob('*.dmg'))
          if len(dmgs) != 1:
              raise SystemExit('Expected exactly one Apple Silicon DMG')
          assets = Path('release-assets')
          assets.mkdir()
          shutil.copy2(dmgs[0], assets / dmgs[0].name)
          shutil.copy2(archives[0], assets / f'Iceon_{version}_aarch64.app.tar.gz')
          PY
          dmg=(release-assets/*.dmg)
          hdiutil verify "${dmg[0]}"
          mount_dir=$(mktemp -d)
          mount_dir=$(cd "$mount_dir" && pwd -P)
          cleanup() {
            status=$?
            trap - EXIT
            if mount | grep -Fq " on $mount_dir ("; then
              # Spotlight can briefly hold a newly mounted image; never force-detach it.
              for attempt in 1 2 3; do
                if hdiutil detach "$mount_dir"; then
                  break
                fi
                sleep 2
              done
            fi
            if mount | grep -Fq " on $mount_dir ("; then
              echo 'Failed to detach release DMG after three attempts' >&2
              status=1
            else
              rmdir "$mount_dir" || status=$?
            fi
            exit "$status"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg[0]}"
          app="$mount_dir/Iceon.app"
          test -d "$app"
          test ! -L "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$app/Contents/MacOS/iceon")" = arm64
          # Compare metadata, executable and signed resource manifest to the audited source bundle.
          for relative in Contents/Info.plist Contents/MacOS/iceon Contents/_CodeSignature/CodeResources; do
            cmp "$bundle/macos/Iceon.app/$relative" "$app/$relative"
          done
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
      - name: Build Windows x86 NSIS installer with signed updater artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          @('WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD') | ForEach-Object {
            Remove-Item "Env:$_" -ErrorAction SilentlyContinue
          }
          bun run tauri build --target i686-pc-windows-msvc --bundles nsis --config .github/release-windows.json -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked files' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified the index' }
      - name: Audit application and installer PE architecture, metadata and signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'src-tauri/target/i686-pc-windows-msvc/release'
          $app = Get-Item "$root/iceon.exe"
          $setups = @(Get-ChildItem "$root/bundle/nsis" -File -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one NSIS setup executable' }
          foreach ($file in @($app, $setups[0])) {
            if ($file.Length -le 0 -or $file.Length -gt 256MB) { throw "Invalid size: $($file.Name)" }
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d) { throw 'Missing DOS header' }
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($offset -lt 0 -or $offset -gt $bytes.Length - 26) { throw 'Invalid PE offset' }
            if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x14c -or
                [BitConverter]::ToUInt16($bytes, $offset + 24) -ne 0x10b) { throw "Not a 32-bit x86 PE: $($file.Name)" }
            if ((Get-AuthenticodeSignature $file.FullName).Status -ne 'NotSigned') {
              throw "Expected unsigned Iceon binary: $($file.Name)"
            }
          }
          $info = $app.VersionInfo
          if ($info.ProductName -cne 'Iceon' -or $info.ProductVersion -cne $env:RELEASE_TAG) {
            throw 'Application product metadata differs from release'
          }
          if ($info.FileVersion -cne $env:RELEASE_TAG -or
              "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)" -cne "$($env:RELEASE_TAG).0") {
            throw 'Application file version differs from release'
          }
          $unwanted = @(Get-ChildItem "$root/bundle" -Recurse -File | Where-Object {
            $_.Name -eq 'latest.json' -or $_.Name -like '*.msi' -or $_.Name -like '*.nsis.zip'
          })
          if ($unwanted.Count -ne 0) { throw 'Unexpected updater or MSI artifact' }
          if (-not (Test-Path ($setups[0].FullName + '.sig'))) { throw 'Missing updater signature' }
          New-Item -ItemType Directory release-assets | Out-Null
          Copy-Item $setups[0].FullName "release-assets/Iceon_$($env:RELEASE_TAG)_x86-setup.exe"
      - name: Sign canonical updater asset names with the release version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            asset="release-assets/Iceon_${RELEASE_TAG}_aarch64.app.tar.gz"
          else
            asset="release-assets/Iceon_${RELEASE_TAG}_x86-setup.exe"
          fi
          bun run tauri signer sign --app-version "$RELEASE_TAG" "$asset"
      - name: Verify canonical updater asset against embedded public key
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            asset="release-assets/Iceon_${RELEASE_TAG}_aarch64.app.tar.gz"
          else
            asset="release-assets/Iceon_${RELEASE_TAG}_x86-setup.exe"
          fi
          cargo run --manifest-path xtask/Cargo.toml --locked --target "${{ matrix.target }}" -- verify-update src-tauri/tauri.conf.json "$asset.sig" "$asset" "$RELEASE_TAG"
      - name: Transfer verified public artifacts to aggregate publisher
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: signed-macOS-arm64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86
          path: release-assets
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xtask -> target
      - name: Verify transferred updater artifacts
        run: |
          for asset in "release-assets/Iceon_${RELEASE_TAG}_aarch64.app.tar.gz" "release-assets/Iceon_${RELEASE_TAG}_x86-setup.exe"; do
            cargo run --manifest-path xtask/Cargo.toml --locked -- verify-update src-tauri/tauri.conf.json "$asset.sig" "$asset" "$RELEASE_TAG"
          done
      - name: Assemble exact public release asset set and release notes
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assets = Path('release-assets')
          mac = f'Iceon_{tag}_aarch64.app.tar.gz'
          windows = f'Iceon_{tag}_x86-setup.exe'
          expected = [f'Iceon_{tag}_aarch64.dmg', mac, mac + '.sig', windows, windows + '.sig']
          if sorted(p.name for p in assets.iterdir()) != sorted(expected):
              raise SystemExit('Expected exactly the DMG, updater archive, NSIS setup and two signatures')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(tag) + r'(?: \(pending CI\))?\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if section is None or not section[1].strip():
              raise SystemExit('Missing release changelog section')
          notes = section[1].strip()
          base = f'https://github.com/yan-ad/iceon/releases/download/{tag}/'
          manifest = {'version': tag, 'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {target: {'signature': (assets / (name + '.sig')).read_text().strip(), 'url': base + name}
                  for target, name in [('darwin-aarch64', mac), ('windows-i686', windows)]}}
          (assets / 'latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          expected.append('latest.json')
          lines = []
          for name in expected:
              path = assets / name
              if not path.is_file() or path.is_symlink() or not 0 < path.stat().st_size <= 256 * 1024 * 1024:
                  raise SystemExit(f'Invalid asset: {name}')
              lines.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n')
          (assets / 'SHASUMS256.txt').write_text(''.join(lines))
          Path('/tmp/iceon-release-notes.md').write_text(notes + '\n')
          PY
          (cd release-assets && sha256sum --check SHASUMS256.txt)
      - name: Create fresh draft, verify GitHub asset digests and downloads, publish latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/iceon/release-tags/${RELEASE_TAG}"
          python3 -m unittest discover -s .github/scripts -p 'test_publish_release.py'
          python3 .github/scripts/publish_release.py
