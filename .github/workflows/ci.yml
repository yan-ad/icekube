name: CI

on:
  push:
    branches: [super]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            xtask -> target
      - name: Check formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: Test backend and release tooling
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path xtask/Cargo.toml --locked
      - name: Export real Rust detail contract for browser shards
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked export_frontend_detail_contract -- --nocapture > "$RUNNER_TEMP/detail-contract.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'detail-contract.log').read_text().splitlines()
          records = [line.removeprefix('DETAIL_CONTRACT_JSON:') for line in lines if line.startswith('DETAIL_CONTRACT_JSON:')]
          if len(records) != 1:
              raise SystemExit('Expected one real Rust detail-contract export')
          cases = json.loads(records[0])
          if not isinstance(cases, list) or len(cases) != 41:
              raise SystemExit('Expected all 41 projected resource kinds')
          Path('detail-contract.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'cases': cases}))
          PY
      - name: Upload detail contract
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rust-detail-contract
          path: detail-contract.json
          if-no-files-found: error
          retention-days: 1
      - name: Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings

  frontend:
    name: Browser fixtures (${{ matrix.shard }}/4)
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ICEON_DETAIL_CONTRACT: .ci-fixtures/detail-contract.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Download same-commit Rust detail contract
        uses: actions/download-artifact@v4
        with:
          name: rust-detail-contract
          path: .ci-fixtures
      - name: Install frozen frontend dependencies
        timeout-minutes: 3
        run: bun install --frozen-lockfile
      - name: Build frontend
        timeout-minutes: 3
        run: bun run build
      - name: Install Chromium
        timeout-minutes: 5
        run: bunx playwright install --with-deps chromium
      - name: Run bounded browser shard with mocked IPC
        timeout-minutes: 10
        run: bun run test:e2e --workers=2 --fully-parallel --shard=${{ matrix.shard }}/4 --global-timeout=480000
      - name: Upload shard report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
