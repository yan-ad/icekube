name: Release dry run (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate selected commit and synchronized versions
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          if config.get('productName') != 'IceKube':
              raise SystemExit('Dry-run bundle paths require productName to be exactly IceKube')
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          local = [p for p in lock['package'] if p['name'] == 'icekube' and 'source' not in p]
          if len(local) != 1:
              raise SystemExit('Expected one local icekube package in Cargo.lock')
          version = package['version']
          number = r'(?:0|[1-9][0-9]*)'
          identifier = rf'(?:{number}|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          if not re.fullmatch(semver, version):
              raise SystemExit('Expected a canonical SemVer application version')
          if any(v != version for v in [config['version'], cargo['package']['version'], local[0]['version']]):
              raise SystemExit('Application manifests and Cargo.lock versions differ')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('Checkout differs from the commit tested by reusable CI')
          overlay = json.loads(Path('.github/release-unsigned.json').read_text())
          if overlay['bundle']['createUpdaterArtifacts'] is not False or overlay['bundle']['macOS']['signingIdentity'] != '-':
              raise SystemExit('Dry run requires the tracked ad-hoc signing overlay without updater artifacts')
          if overlay['plugins']['updater'] != {'pubkey': '', 'endpoints': []}:
              raise SystemExit('Dry run requires disabled updater configuration')
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build ad-hoc application without signing secrets or notarization
        env:
          SKIP_NOTARIZATION: 'true'
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_PATH TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          bun run tauri build --target aarch64-apple-darwin --bundles app \
            --config .github/release-unsigned.json -- --locked
          git diff --exit-code
          git diff --cached --exit-code
      - name: Create headless DMG without Finder or AppleScript
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto "$bundle/macos/IceKube.app" "$staging/IceKube.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$bundle/dmg"
          hdiutil create -volname IceKube -srcfolder "$staging" -ov -format UDZO \
            "$bundle/dmg/IceKube_dry-run_aarch64.dmg"
      - name: Verify bundle metadata, signature, architecture and updater absence
        env:
          CHECKED_COMMIT: ${{ github.sha }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/IceKube.app"
          codesign -dv --verbose=4 "$bundle/macos/IceKube.app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$bundle/macos/IceKube.app/Contents/MacOS/icekube")" = arm64
          python3 - <<'PY'
          import json, os, plistlib, shutil
          from pathlib import Path
          bundle = Path('src-tauri/target/aarch64-apple-darwin/release/bundle')
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          with (bundle / 'macos/IceKube.app/Contents/Info.plist').open('rb') as f:
              plist = plistlib.load(f)
          version = config['version']
          # Tauri uses the complete SemVer for both keys unless bundleVersion overrides it.
          expected_build = config.get('bundle', {}).get('macOS', {}).get('bundleVersion', version)
          expected = {'CFBundleShortVersionString': version, 'CFBundleVersion': expected_build,
                      'CFBundleIdentifier': config['identifier'], 'CFBundleExecutable': 'icekube',
                      'CFBundleName': config['productName']}
          for key, value in expected.items():
              if plist.get(key) != value:
                  raise SystemExit(f'{key} differs from configured value: {plist.get(key)!r} != {value!r}')
          if 'CFBundleDisplayName' in plist and plist['CFBundleDisplayName'] != config['productName']:
              raise SystemExit('CFBundleDisplayName must be absent or match productName')
          if any(list(bundle.rglob(pattern)) for pattern in ['latest.json', '*.sig', '*.app.tar.gz']):
              raise SystemExit('Dry run must not produce updater artifacts')
          dmgs = list((bundle / 'dmg').glob('*.dmg'))
          if len(dmgs) != 1:
              raise SystemExit('Expected exactly one Apple Silicon DMG')
          assets = Path('dry-run-assets')
          assets.mkdir()
          shutil.copy2(dmgs[0], assets / dmgs[0].name)
          shutil.copy2(bundle / 'macos/IceKube.app/Contents/Info.plist', assets / 'Info.plist')
          (assets / 'build.json').write_text(json.dumps({'commit': os.environ['CHECKED_COMMIT'],
              'version': version, 'architecture': 'arm64', 'signature': 'ad-hoc',
              'notarized': False, 'updaterArtifacts': False}, indent=2) + '\n')
          PY
          dmg=(dry-run-assets/*.dmg)
          hdiutil verify "${dmg[0]}"
          mount_dir=$(mktemp -d)
          mount_dir=$(cd "$mount_dir" && pwd -P)
          cleanup() {
            status=$?
            trap - EXIT
            if mount | grep -Fq " on $mount_dir ("; then
              # Spotlight can briefly hold a newly mounted image; never force-detach it.
              for attempt in 1 2 3; do
                if hdiutil detach "$mount_dir"; then
                  break
                fi
                sleep 2
              done
            fi
            if mount | grep -Fq " on $mount_dir ("; then
              echo 'Failed to detach dry-run DMG after three attempts' >&2
              status=1
            else
              rmdir "$mount_dir" || status=$?
            fi
            exit "$status"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg[0]}"
          app="$mount_dir/IceKube.app"
          test -d "$app"
          test ! -L "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$app/Contents/MacOS/icekube")" = arm64
          # Compare metadata, executable and signed resource manifest to the audited source bundle.
          for relative in Contents/Info.plist Contents/MacOS/icekube Contents/_CodeSignature/CodeResources; do
            cmp "$bundle/macos/IceKube.app/$relative" "$app/$relative"
          done
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          (cd dry-run-assets && shasum -a 256 ./*.dmg Info.plist build.json > SHASUMS256.txt && shasum -a 256 -c SHASUMS256.txt)
      - name: Upload dry-run evidence only (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ github.sha }}
          path: dry-run-assets/
          if-no-files-found: error
          retention-days: 7
