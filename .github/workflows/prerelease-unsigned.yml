name: Unsigned Apple Silicon prerelease

on:
  push:
    tags: ['*-pre.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable prerelease tag to rebuild after CI recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-prerelease-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Apple Silicon runner and exact prerelease tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          number = r'(0|[1-9][0-9]*)'
          if not re.fullmatch(rf'{number}\.{number}\.{number}-pre\.{number}', tag):
              raise SystemExit('Expected an exact X.Y.Z-pre.N tag without a v prefix')
          package = json.loads(Path('package.json').read_text())
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          app_entries = [p for p in lock['package'] if p['name'] == 'icekube' and 'source' not in p]
          if len(app_entries) != 1:
              raise SystemExit('Expected one local icekube package in Cargo.lock')
          versions = [package['version'], config['version'], cargo['package']['version'], app_entries[0]['version']]
          if any(version != tag for version in versions):
              raise SystemExit('Tag must match all application manifest and Cargo.lock versions')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if git('rev-parse', f'refs/tags/{tag}^{{commit}}') != head:
              raise SystemExit('Tag and checked-out commit must agree')
          if os.environ['RELEASE_EVENT'] == 'push' and head != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Tag and Actions push commit must agree')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build ad-hoc signed DMG without updater artifacts or notarization
        env:
          SKIP_NOTARIZATION: 'true'
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_PATH TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          bun run tauri build --target aarch64-apple-darwin --bundles app \
            --config .github/release-unsigned.json -- --locked
          git diff --exit-code
          git diff --cached --exit-code
      - name: Create headless DMG without Finder or AppleScript
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto "$bundle/macos/IceKube.app" "$staging/IceKube.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$bundle/dmg"
          hdiutil create -volname IceKube -srcfolder "$staging" -ov -format UDZO \
            "$bundle/dmg/IceKube_${RELEASE_TAG}_aarch64.dmg"
      - name: Verify bundle and prepare checksums
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/IceKube.app"
          codesign -dv --verbose=4 "$bundle/macos/IceKube.app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(lipo -archs "$bundle/macos/IceKube.app/Contents/MacOS/icekube")" = arm64
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          bundle = Path('src-tauri/target/aarch64-apple-darwin/release/bundle')
          with (bundle / 'macos/IceKube.app/Contents/Info.plist').open('rb') as f:
              plist = plistlib.load(f)
          version = json.loads(Path('package.json').read_text())['version']
          if plist['CFBundleShortVersionString'] != version:
              raise SystemExit('Bundled application version differs from the prerelease')
          if list(bundle.rglob('latest.json')) or list(bundle.rglob('*.sig')) or list(bundle.rglob('*.app.tar.gz')):
              raise SystemExit('Unsigned prereleases must not produce updater artifacts')
          dmgs = list((bundle / 'dmg').glob('*.dmg'))
          if len(dmgs) != 1:
              raise SystemExit('Expected exactly one Apple Silicon DMG')
          Path('release-assets').mkdir()
          import shutil
          shutil.copy2(dmgs[0], Path('release-assets') / dmgs[0].name)
          PY
          hdiutil verify release-assets/*.dmg
          (cd release-assets && shasum -a 256 ./*.dmg > SHASUMS256.txt)
      - name: Create exact-tag draft, verify assets, then publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Apple Silicon macOS prerelease

          This DMG is for Apple Silicon Macs only. It is ad-hoc signed, not Developer ID signed or notarized. macOS Gatekeeper may block it. No Intel, Linux or Windows installer is included. Automatic updates are disabled; no updater manifest or signature is published.

          1. Download the DMG and SHASUMS256.txt from this exact release. Check the downloaded DMG with `shasum -a 256 -c SHASUMS256.txt` in the download directory. Checksums detect corruption, not publisher identity.
          2. Open the DMG and drag IceKube.app into Applications.
          3. Only if you trust this repository and this downloaded release, remove quarantine from this installed app, then open it:

          ```sh
          xattr -dr com.apple.quarantine /Applications/IceKube.app
          open /Applications/IceKube.app
          ```

          Do not disable Gatekeeper globally or remove quarantine from an untrusted download. This is an early prerelease; use it only with clusters and credentials you intend to expose to the app.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --prerelease --latest=false --title "IceKube $RELEASE_TAG (unsigned)" \
            --notes-file release-notes.md
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'tagName,isDraft,isPrerelease,assets']))
          expected = sorted(p.name for p in Path('release-assets').iterdir())
          actual = sorted(a['name'] for a in release['assets'])
          if release['tagName'] != tag or not release['isDraft'] or not release['isPrerelease'] or actual != expected:
              raise SystemExit('Expected an exact-tag prerelease draft containing only the DMG and checksums')
          subprocess.run(['gh', 'release', 'download', tag, '--dir', 'release-verify'], check=True)
          if Path('release-verify/SHASUMS256.txt').read_bytes() != Path('release-assets/SHASUMS256.txt').read_bytes():
              raise SystemExit('Uploaded checksums differ from the built assets')
          subprocess.run(['shasum', '-a', '256', '-c', 'SHASUMS256.txt'], cwd='release-verify', check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease', '--latest=false'], check=True)
          PY
