[package]
name = "icekube"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "icekube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
url = "2"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
getrandom = "0.4"
fs2 = "0.4"
kube = { version = "4.2.0", default-features = true }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
http-body-util = "0.1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
jiff = "0.2"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
