[package]
name = "freelens-tauri-dev"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.3", features = ["custom-protocol"] }

[profile.dev]
debug = 0
incremental = false
